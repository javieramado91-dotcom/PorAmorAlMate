                        <div className="text-left">
                            <p className="font-bold text-orange-800 text-sm">Seña / Adelanto parcial</p>
                            <p className="text-[11px] text-orange-500">Registrar un pago parcial, queda saldo pendiente</p>
                        </div>
                    </button>
                </div>
            </div>
        ) : paymentModalStep === 'partial' ? (
            <div className="space-y-5 pt-2 animate-in slide-in-from-right-4">
                <div className="bg-orange-50 border border-orange-100 rounded-2xl p-4">
                    <div className="flex justify-between items-center mb-2">
                        <div>
                            <p className="text-xs text-stone-400 font-bold uppercase">Total pedido</p>
                            <p className="text-lg font-black text-stone-700">${totalPrice.toLocaleString()}</p>
                        </div>
                        {hasAdvance && <div className="text-stone-300">—</div>}
                        {hasAdvance && (
                            <div>
                                <p className="text-xs text-orange-500 font-bold uppercase">Ya adelantó</p>
                                <p className="text-lg font-black text-orange-500">${alreadyPaid.toLocaleString()}</p>
                            </div>
                        )}
                        <div className="text-stone-300">→</div>
                        <div>
                            <p className="text-xs text-red-500 font-bold uppercase">Saldo</p>
                            <p className="text-lg font-black text-red-500">${remaining.toLocaleString()}</p>
                        </div>
                    </div>
                </div>
                <div className="space-y-4">
                    <div>
                        <label className="text-xs font-bold text-stone-500 uppercase mb-2 flex items-center gap-1"><Coins size={12}/> Monto que entrega ahora</label>
                        <input type="number" placeholder="0" className="w-full p-4 bg-white border-2 border-orange-200 rounded-xl font-bold text-xl focus:ring-2 focus:ring-orange-500/20 focus:border-orange-400 outline-none" value={partialPayment.amount} onChange={(e) => setPartialPayment({...partialPayment, amount: e.target.value})} autoFocus />
                    </div>
                    <div>
                        <label className="text-xs font-bold text-stone-500 uppercase mb-2">Cómo paga este adelanto</label>
                        <div className="grid grid-cols-2 gap-2">
                            <button type="button" onClick={() => setPartialPayment({...partialPayment, method: 'cash'})} className={`py-3 rounded-xl border-2 font-bold text-sm transition-all flex items-center justify-center gap-2 ${partialPayment.method === 'cash' ? 'bg-green-100 border-green-300 text-green-800' : 'bg-white border-stone-200 text-stone-400 hover:bg-stone-50'}`}><Banknote size={16}/>Efectivo</button>
                            <button type="button" onClick={() => setPartialPayment({...partialPayment, method: 'transfer'})} className={`py-3 rounded-xl border-2 font-bold text-sm transition-all flex items-center justify-center gap-2 ${partialPayment.method === 'transfer' ? 'bg-blue-100 border-blue-300 text-blue-800' : 'bg-white border-stone-200 text-stone-400 hover:bg-stone-50'}`}><CreditCard size={16}/>Transferencia</button>
                        </div>
                    </div>
                </div>
                <div className="flex gap-3 pt-2">
                    <button onClick={() => setPaymentModalStep('select')} className="flex-1 py-3 rounded-xl font-bold bg-stone-100 text-stone-500 hover:bg-stone-200">Volver</button>
                    <button onClick={() => confirmPayment('partial')} className="flex-[2] py-3 rounded-xl font-bold bg-orange-500 text-white hover:bg-orange-600 shadow-lg shadow-orange-200">Registrar Adelanto</button>
                </div>
            </div>
        ) : (
            <div className="space-y-5 pt-2 animate-in slide-in-from-right-4">
                <div className="bg-purple-50 border border-purple-100 rounded-2xl p-4 text-center">
                    <p className="text-xs text-stone-400 uppercase font-bold mb-1">Saldo a cobrar</p>
                    <p className="text-2xl font-black text-stone-900">${remaining.toLocaleString()}</p>
                    {hasAdvance && <p className="text-[11px] text-orange-500 mt-1">Ya adelantó ${alreadyPaid.toLocaleString()}</p>}
                </div>
                <div className="space-y-4">
                    <div>
                        <label className="text-xs font-bold text-green-600 uppercase mb-1 flex items-center gap-1"><Banknote size={12}/> Monto en Efectivo</label>
                        <input type="number" placeholder="0" className="w-full p-4 bg-white border-2 border-green-200 rounded-xl font-bold text-lg focus:ring-2 focus:ring-green-500/20 focus:border-green-400 outline-none" value={mixedAmounts.cash} onChange={(e) => handleNewPaymentMixedChange('cash', e.target.value)} onFocus={e => e.target.select()} autoFocus />
                    </div>
                    <div className="flex justify-center"><ArrowDownCircle size={20} className="text-stone-300"/></div>
                    <div>
                        <label className="text-xs font-bold text-blue-600 uppercase mb-1 flex items-center gap-1"><CreditCard size={12}/> Resto en Transferencia (auto)</label>
                        <input type="number" className="w-full p-4 bg-stone-50 border-2 border-blue-100 rounded-xl font-bold text-lg text-stone-500" value={mixedAmounts.transfer} readOnly />
                    </div>
                </div>
                <div className="flex gap-3 pt-2">
                    <button onClick={() => setPaymentModalStep('select')} className="flex-1 py-3 rounded-xl font-bold bg-stone-100 text-stone-500 hover:bg-stone-200">Volver</button>
                    <button onClick={() => confirmPayment('mixed')} className="flex-[2] py-3 rounded-xl font-bold bg-purple-600 text-white hover:bg-purple-700 shadow-lg shadow-purple-200">Confirmar Pago Mixto</button>
                </div>
            </div>
        );
    })()}
</Modal>

                    {/* MODAL ELIMINAR PEDIDO CON OPCIÓN DE REPONER STOCK */}
                    {deleteOrderModal.isOpen && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-in fade-in duration-200">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden animate-in zoom-in-95 duration-300">
                                <div className="p-6 flex flex-col items-center text-center">
                                    <div className="bg-red-50 text-red-500 p-4 rounded-full mb-4"><Trash2 size={32}/></div>
                                    <h3 className="text-xl font-bold text-stone-800 mb-1">Eliminar Pedido</h3>
                                    <p className="text-stone-500 text-sm mb-1">Pedido de <span className="font-bold text-stone-700">{deleteOrderModal.order?.client}</span></p>
                                    {deleteOrderModal.order?.items?.some(i => i.productId) ? (
                                        <>
                                            <p className="text-xs text-stone-400 mb-3">¿Querés reponer los productos al inventario?</p>
                                            <div className="w-full bg-stone-50 rounded-2xl p-3 mb-5 text-left space-y-1">
                                                {deleteOrderModal.order.items.filter(i => i.productId).map((item, i) => (
                                                    <div key={i} className="flex justify-between text-xs text-stone-600">
                                                        <span>{item.name || item.detail}</span>
                                                        <span className="font-bold text-emerald-600">+{item.quantity} u.</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <p className="text-xs text-stone-400 mb-5">Esta acción no se puede deshacer.</p>
                                    )}
                                    <div className="flex flex-col gap-2 w-full">
                                        {deleteOrderModal.order?.items?.some(i => i.productId) && (
                                            <button onClick={() => confirmDeleteOrder(true)} className="w-full py-3 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-600 text-white transition-colors flex items-center justify-center gap-2">
                                                <Package size={16}/> Eliminar y reponer stock
                                            </button>
                                        )}
                                        <button onClick={() => confirmDeleteOrder(false)} className="w-full py-3 rounded-xl font-bold bg-red-500 hover:bg-red-600 text-white transition-colors">
                                            Eliminar sin reponer
                                        </button>
                                        <button onClick={() => setDeleteOrderModal({ isOpen: false, order: null })} className="w-full py-3 rounded-xl font-bold bg-stone-100 text-stone-600 hover:bg-stone-200 transition-colors">
                                            Cancelar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                     <Modal isOpen={isDeliveryModalOpen} onClose={() => setIsDeliveryModalOpen(false)} title="Confirmar Entrega">
                        <div className="space-y-4 animate-in fade-in zoom-in-95 duration-200">
                            <div className="bg-blue-50 p-4 rounded-2xl flex items-center gap-3 border border-blue-100"><div className="bg-blue-100 p-2 rounded-xl text-blue-600"><Truck size={24}/></div><div><p className="font-bold text-blue-800 text-sm">Estás por entregar el pedido:</p><p className="text-blue-600 text-xs">{orders.find(o => o.id === pendingDeliveryId)?.detail}</p></div></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Fecha y Hora de Entrega</label><div className="relative"><div className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400"><Clock size={18}/></div><input type="datetime-local" className="w-full pl-11 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none text-sm font-medium" value={deliveryDateInput} onChange={(e) => setDeliveryDateInput(e.target.value)} /></div><p className="text-[10px] text-stone-400 ml-1">Dejar como está para usar fecha actual.</p></div>
                            <div className="flex gap-3 pt-2"><button onClick={() => setIsDeliveryModalOpen(false)} className="flex-1 py-3 rounded-xl font-bold bg-stone-100 text-stone-500 hover:bg-stone-200 transition-colors">Cancelar</button><button onClick={handleDeliveryConfirm} className="flex-[2] py-3 rounded-xl font-bold bg-stone-900 text-white hover:bg-stone-800 transition-colors shadow-lg">Confirmar Entrega</button></div>
                        </div>
                    </Modal>

                    <Modal isOpen={isTransferModalOpen} onClose={() => setIsTransferModalOpen(false)} title="Pasar Efectivo a Banco">
                        <form onSubmit={handleSaveTransfer} className="space-y-5">
                            <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 flex items-start gap-3">
                                <div className="bg-indigo-100 text-indigo-600 p-2 rounded-xl shrink-0"><Repeat size={20}/></div>
                                <div>
                                    <p className="text-sm font-bold text-indigo-800">Movimiento interno</p>
                                    <p className="text-xs text-indigo-500 mt-0.5">Resta del efectivo y suma a la cuenta bancaria. No afecta ingresos ni gastos.</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-green-50 border border-green-100 rounded-xl p-3 text-center">
                                    <p className="text-[10px] font-bold text-green-600 uppercase mb-1">Efectivo actual</p>
                                    <p className="text-lg font-black text-green-700">${finances.totalCash.toLocaleString()}</p>
                                </div>
                                <div className="bg-blue-50 border border-blue-100 rounded-xl p-3 text-center">
                                    <p className="text-[10px] font-bold text-blue-600 uppercase mb-1">Digital actual</p>
                                    <p className="text-lg font-black text-blue-700">${finances.totalTransfer.toLocaleString()}</p>
                                </div>
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-stone-500 uppercase">Monto a transferir</label>
                                <input type="number" placeholder="0" autoFocus className="w-full p-4 bg-stone-50 border-2 border-indigo-200 rounded-xl font-bold text-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 outline-none" value={transferForm.amount} onChange={e => setTransferForm({...transferForm, amount: e.target.value})} onFocus={e => e.target.select()} />
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-stone-500 uppercase">Nota (opcional)</label>
                                <input type="text" placeholder="Ej: Depósito bancario del día" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm" value={transferForm.note} onChange={e => setTransferForm({...transferForm, note: e.target.value})} />
                            </div>
                            <button type="submit" disabled={isSaving} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-70 transition-colors">
                                {isSaving ? <Loader2 size={20} className="animate-spin"/> : <><Repeat size={18}/> Confirmar movimiento</>}
                            </button>
                        </form>
                    </Modal>

                    <Modal isOpen={isExpenseModalOpen} onClose={() => setIsExpenseModalOpen(false)} title="Registrar Gasto">
                        <form onSubmit={handleSaveExpense} className="space-y-5">
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Fecha</label><input type="date" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} /></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Descripción</label><input type="text" placeholder="Ej: Compra de yerba..." autoFocus className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} /></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Monto</label><input type="number" placeholder="0.00" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-mono" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} onFocus={e => e.target.select()} /></div>
                            <div className="grid grid-cols-2 gap-3"><button type="button" onClick={() => setExpenseForm({...expenseForm, method: 'cash'})} className={`py-3 px-4 rounded-xl border flex items-center justify-center gap-2 ${expenseForm.method === 'cash' ? 'bg-stone-800 text-white' : 'bg-white text-stone-400'}`}><Banknote size={18} /> <span className="text-sm font-bold">Efectivo</span></button><button type="button" onClick={() => setExpenseForm({...expenseForm, method: 'transfer'})} className={`py-3 px-4 rounded-xl border flex items-center justify-center gap-2 ${expenseForm.method === 'transfer' ? 'bg-stone-800 text-white' : 'bg-white text-stone-400'}`}><CreditCard size={18} /> <span className="text-sm font-bold">Transf.</span></button></div>
                            <button type="submit" disabled={isSaving} className="w-full bg-red-500 hover:bg-red-600 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-70">{isSaving ? <Loader2 size={20} className="animate-spin" /> : 'Registrar Salida'}</button>
                        </form>
                    </Modal>
                    
                    <Modal isOpen={isIncomeModalOpen} onClose={() => setIsIncomeModalOpen(false)} title="Registrar Ingreso Extra">
                        <form onSubmit={handleSaveIncome} className="space-y-5">
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Fecha</label><input type="date" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={incomeForm.date} onChange={e => setIncomeForm({...incomeForm, date: e.target.value})} /></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Descripción</label><input type="text" placeholder="Ej: Inversión inicial..." autoFocus className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={incomeForm.description} onChange={e => setIncomeForm({...incomeForm, description: e.target.value})} /></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Monto</label><input type="number" placeholder="0.00" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-mono" value={incomeForm.amount} onChange={e => setIncomeForm({...incomeForm, amount: e.target.value})} onFocus={e => e.target.select()} /></div>
                            <div className="grid grid-cols-2 gap-3"><button type="button" onClick={() => setIncomeForm({...incomeForm, method: 'cash'})} className={`py-3 px-4 rounded-xl border flex items-center justify-center gap-2 ${incomeForm.method === 'cash' ? 'bg-stone-800 text-white' : 'bg-white text-stone-400'}`}><Banknote size={18} /> <span className="text-sm font-bold">Efectivo</span></button><button type="button" onClick={() => setIncomeForm({...incomeForm, method: 'transfer'})} className={`py-3 px-4 rounded-xl border flex items-center justify-center gap-2 ${incomeForm.method === 'transfer' ? 'bg-stone-800 text-white' : 'bg-white text-stone-400'}`}><CreditCard size={18} /> <span className="text-sm font-bold">Transf.</span></button></div>
                            <button type="submit" disabled={isSaving} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-70">{isSaving ? <Loader2 size={20} className="animate-spin" /> : 'Registrar Ingreso'}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={isInventoryModalOpen} onClose={() => setIsInventoryModalOpen(false)} title={editingProductId ? "Editar Producto" : "Nuevo Producto"}>
                        <form onSubmit={handleSaveInventory} className="space-y-5">
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Producto</label><input type="text" placeholder="Ej: Mate Imperial" autoFocus className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={inventoryForm.name} onChange={e => setInventoryForm({...inventoryForm, name: e.target.value})} /></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Detalle</label><input type="text" placeholder="Ej: Con virola de alpaca..." className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={inventoryForm.detail} onChange={e => setInventoryForm({...inventoryForm, detail: e.target.value})} /></div>
                            <div className="flex gap-4"><div className="space-y-1 flex-1"><label className="text-xs font-bold text-stone-400 uppercase">Precio</label><input type="number" placeholder="0.00" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-mono" value={inventoryForm.price} onChange={e => setInventoryForm({...inventoryForm, price: e.target.value})} onFocus={e => e.target.select()} /></div><div className="space-y-1 flex-1"><label className="text-xs font-bold text-stone-400 uppercase">Stock Inicial</label><input type="number" placeholder="0" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-mono" value={inventoryForm.stock} onChange={e => setInventoryForm({...inventoryForm, stock: e.target.value})} onFocus={e => e.target.select()} /></div></div>
                            <button type="submit" disabled={isSaving} className="w-full bg-stone-900 hover:bg-stone-800 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-70">{isSaving ? <Loader2 size={20} className="animate-spin" /> : (editingProductId ? 'Guardar Cambios' : 'Guardar Producto')}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={isDebtModalOpen} onClose={() => setIsDebtModalOpen(false)} title={editingDebtId ? "Editar Deuda" : "Nueva Deuda"}>
                        <form onSubmit={handleSaveDebt} className="space-y-5">
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Detalle</label><input type="text" placeholder="Ej: Tarjeta Visa..." autoFocus className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={debtForm.detail} onChange={e => setDebtForm({...debtForm, detail: e.target.value})} /></div>
                            {!editingDebtId && (
                                <div className="space-y-1">
                                    <label className="text-xs font-bold text-stone-400 uppercase">Tipo</label>
                                    <div className="flex gap-2"><button type="button" onClick={() => setDebtForm({...debtForm, type: 'unique'})} className={`flex-1 py-2 text-sm rounded-xl border ${debtForm.type === 'unique' ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-500 border-stone-200'}`}>Único</button><button type="button" onClick={() => setDebtForm({...debtForm, type: 'installments'})} className={`flex-1 py-2 text-sm rounded-xl border ${debtForm.type === 'installments' ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-500 border-stone-200'}`}>Cuotas</button><button type="button" onClick={() => setDebtForm({...debtForm, type: 'fixed'})} className={`flex-1 py-2 text-sm rounded-xl border ${debtForm.type === 'fixed' ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-500 border-stone-200'}`}>Fijo</button></div>
                                </div>
                            )}
                            {debtForm.type === 'installments' && !editingDebtId && (<div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Cantidad de Cuotas</label><input type="number" placeholder="Ej: 6" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl" value={debtForm.installments} onChange={e => setDebtForm({...debtForm, installments: e.target.value})} onFocus={e => e.target.select()} /></div>)}
                            <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Valor de la Cuota</label><input type="number" placeholder="0.00" className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl font-mono" value={debtForm.amount} onChange={e => setDebtForm({...debtForm, amount: e.target.value})} onFocus={e => e.target.select()} /></div>
                            <button type="submit" disabled={isSaving} className="w-full bg-stone-900 hover:bg-stone-800 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-70">{isSaving ? <Loader2 size={20} className="animate-spin" /> : (editingDebtId ? 'Guardar Cambios' : 'Agregar Deuda')}</button>
                        </form>
                    </Modal>

                    <Modal isOpen={isDebtStatsOpen} onClose={() => setIsDebtStatsOpen(false)} title="Deudas Anuales">
                         <div className="space-y-4">
                            <div className="p-4 bg-stone-100 rounded-2xl">
                                <h4 className="font-bold text-stone-800 mb-4">Proyección de Pagos ({currentDate.getFullYear()})</h4>
                                <div className="space-y-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                                    {debtsStats.map((item, index) => (
                                        <div key={index} className="flex items-center justify-between text-sm"><span className="text-stone-500 w-10">{item.label}</span><div className="flex-1 mx-3 h-2 bg-stone-200 rounded-full overflow-hidden"><div className="bg-red-400 h-full rounded-full" style={{ width: `${(item.value / (Math.max(...debtsStats.map(d => d.value)) || 1)) * 100}%` }}></div></div><span className="font-bold text-stone-800 w-16 text-right">${item.value.toLocaleString()}</span></div>
                                    ))}
                                </div>
                            </div>
                            <div className="text-center text-xs text-stone-400">Total anual estimado: <span className="font-bold text-stone-600">${debtsStats.reduce((a,b) => a + b.value, 0).toLocaleString()}</span></div>
                        </div>
                    </Modal>

                    <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="Configuración">
                        <div className="flex gap-2 mb-6 p-1 bg-stone-100 rounded-xl">
                            <button onClick={() => setSettingsTab('location')} className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${settingsTab === 'location' ? 'bg-white shadow-sm text-stone-900 ring-1 ring-black/5' : 'text-stone-400 hover:text-stone-600'}`}><MapPin size={14} /> Ubicación</button>
                            <button onClick={() => setSettingsTab('security')} className={`flex-1 py-2.5 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${settingsTab === 'security' ? 'bg-white shadow-sm text-stone-900 ring-1 ring-black/5' : 'text-stone-400 hover:text-stone-600'}`}><Shield size={14} /> Seguridad</button>
                        </div>
                        {settingsTab === 'location' ? (
                            <form onSubmit={handleSaveLocation} className="space-y-4 animate-in fade-in duration-300">
                                <p className="text-sm text-stone-500">Ingresa tu ciudad para obtener el clima exacto.</p>
                                <div className="relative"><MapPin className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400" size={20} /><input type="text" placeholder="Ej: Buenos Aires, Rosario..." className="w-full pl-11 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl" value={settingsCity} onChange={e => setSettingsCity(e.target.value)} autoFocus /></div>
                                <button type="submit" className="w-full bg-stone-900 text-white py-3 rounded-xl font-bold disabled:opacity-50" disabled={isSearchingCity}>{isSearchingCity ? 'Buscando...' : 'Guardar Ubicación'}</button>
                                {locationConfig && <div className="text-xs text-center text-emerald-600 font-medium bg-emerald-50 py-2 rounded-lg border border-emerald-100 mt-2">Ubicación actual: {locationConfig.name}, {locationConfig.country}</div>}
                            </form>
                        ) : (
                            <div className="space-y-6 animate-in fade-in duration-300">
                                <form onSubmit={handleUpdateCredentials} className="space-y-5">
                                    <div className="bg-blue-50 p-3 rounded-xl flex gap-3 items-start border border-blue-100"><Info className="text-blue-500 shrink-0 mt-0.5" size={16} /><p className="text-xs text-blue-700 leading-relaxed">Aquí puedes cambiar el usuario y contraseña para acceder al sistema.</p></div>
                                    <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase ml-1">Nuevo Usuario</label><div className="relative"><User className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400" size={18} /><input type="text" className="w-full pl-11 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl" value={tempCredentials.user} onChange={e => setTempCredentials({...tempCredentials, user: e.target.value})} /></div></div>
                                    <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase ml-1">Nueva Contraseña</label><div className="relative"><Lock className="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400" size={18} /><input type="text" className="w-full pl-11 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl" value={tempCredentials.pass} onChange={e => setTempCredentials({...tempCredentials, pass: e.target.value})} /></div></div>
                                    <button type="submit" className="w-full bg-stone-900 text-white py-3 rounded-xl font-bold">Actualizar Credenciales</button>
                                </form>
                                <div className="border-t border-stone-100 pt-6">
                                    <h4 className="text-xs font-bold text-stone-400 uppercase mb-3">Diagnóstico de Conexión</h4>
                                    <button onClick={runDiagnostic} className="w-full bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-colors"><Stethoscope size={18} /> Probar Conexión a Base de Datos</button>
                                    {diagMessage && (
                                        <div className={`mt-3 p-3 rounded-xl text-sm font-medium flex items-center gap-2 ${diagMessage.type === 'success' ? 'bg-green-100 text-green-800' : (diagMessage.type === 'error' ? 'bg-red-100 text-red-800' : 'bg-stone-100 text-stone-600')}`}>
                                            {diagMessage.type === 'loading' && <Loader2 size={16} className="animate-spin" />}
                                            {diagMessage.type === 'success' && <Check size={16} />}
                                            {diagMessage.type === 'error' && <AlertCircle size={16} />}
                                            {diagMessage.text}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </Modal>
                    
                    <Modal isOpen={isContactModalOpen} onClose={() => setIsContactModalOpen(false)} title="Sobre el Creador">
                        <div className="flex flex-col items-center text-center p-4">
                            <div className="h-20 w-20 bg-stone-900 rounded-full flex items-center justify-center text-white text-2xl font-bold mb-4 shadow-lg">JA</div>
                            <h3 className="text-xl font-bold text-stone-800 mb-1">Javier Amado</h3>
                            <p className="text-sm text-stone-500 mb-6">Desarrollador Full Stack</p>
                            <div className="w-full space-y-3"><div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-100"><div className="bg-white p-2 rounded-lg text-stone-600 shadow-sm"><Phone size={18} /></div><div className="text-left"><p className="text-[10px] uppercase font-bold text-stone-400">Celular</p><p className="text-sm font-medium text-stone-800">2355-440269</p></div></div><div className="flex items-center gap-3 p-3 bg-stone-50 rounded-xl border border-stone-100"><div className="bg-white p-2 rounded-lg text-stone-600 shadow-sm"><Mail size={18} /></div><div className="text-left"><p className="text-[10px] uppercase font-bold text-stone-400">Email</p><p className="text-sm font-medium text-stone-800">javieramado91@gmail.com</p></div></div></div>
                            <button onClick={() => setIsContactModalOpen(false)} className="mt-6 text-sm text-stone-400 hover:text-stone-600">Cerrar</button>
                        </div>
                    </Modal>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<MateManagerApp />);
    </script>
</body>
</html>
