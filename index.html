<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧉</text></svg>">
    
    <title>Por Amor Al Mate - Gestión</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- jsPDF & AutoTable for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Scrollbar personalizada sutil */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
        
        /* Sidebar Scrollbar Dark */
        .sidebar-scrollbar::-webkit-scrollbar { width: 4px; }
        .sidebar-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scrollbar::-webkit-scrollbar-thumb { background: #44403c; border-radius: 10px; }
        .sidebar-scrollbar::-webkit-scrollbar-thumb:hover { background: #57534e; }

        .chart-bar { transition: height 1s ease-out; }
        
        /* Animaciones para Toasts */
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }

        /* Estilos móvil */
        .mobile-nav-item {
            @apply flex flex-col items-center justify-center text-stone-400 transition-colors py-2 flex-1;
        }
        .mobile-nav-item.active {
            @apply text-emerald-600;
        }
        .mobile-nav-item.active svg {
            @apply stroke-[2.5px];
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      }
    }
    </script>
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>
</head>
<body class="bg-[#FAFAF9] text-stone-800 h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Check, X, TrendingUp, Package, DollarSign, Calendar, Search, 
            Trash2, Leaf, Award, Zap, Plus, AlertCircle, BarChart3, 
            BrainCircuit, Home, PieChart, Star, Pencil, Filter, 
            MoreHorizontal, Sun, Cloud, CloudRain, ChevronLeft, 
            ChevronRight, Wind, CloudLightning, MapPin, Settings, Loader2,
            Wallet, ArrowUpRight, ArrowDownLeft, Banknote, CreditCard,
            TrendingDown, Activity, Info, FileJson, LogOut, Lock, Shield, User, Wifi, WifiOff, Stethoscope, Coins, ShoppingBag, Minus, Layers, AlertTriangle, Tag, List, Receipt, CheckCircle2, Circle, Repeat, Truck, Phone, Mail, Code, ArrowUpCircle, ArrowDownCircle, Printer, Boxes, AlertOctagon, Split, Clock, Edit3, ShoppingCart, ToggleLeft, ToggleRight
        } from 'lucide-react';

        // --- FIREBASE SETUP ---
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, writeBatch, getDoc } from "firebase/firestore";

        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        const localConfig = {
            apiKey: "AIzaSyDnsoEp_t5lvF4K1vkhK7cWJ-B3NGE3_AI",
            authDomain: "por-amor-al-mate.firebaseapp.com",
            projectId: "por-amor-al-mate",
            storageBucket: "por-amor-al-mate.firebasestorage.app",
            messagingSenderId: "136176515954",
            appId: "1:136176515954:web:1e530cab217c2bf5b67beb",
            measurementId: "G-GWN0PYZ2PK"
        };

        let firebaseConfig;
        let isConfigured = true;

        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            firebaseConfig = localConfig;
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, auth, db;
        
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
            isConfigured = false;
        }

        // --- PANTALLA DE ERROR DE CONFIGURACIÓN ---
        const ConfigErrorScreen = () => (
            <div className="h-full w-full bg-stone-900 flex items-center justify-center p-4">
                <div className="bg-white max-w-lg w-full rounded-3xl p-8 shadow-2xl text-stone-800">
                    <div className="bg-red-100 text-red-600 w-16 h-16 rounded-2xl flex items-center justify-center mb-6"><AlertCircle size={32} /></div>
                    <h1 className="text-2xl font-bold mb-2">Error Crítico</h1>
                    <p className="text-stone-500 mb-6">No se pudo iniciar la conexión con Firebase.</p>
                    <button onClick={() => window.location.reload()} className="w-full bg-stone-900 text-white py-3 rounded-xl font-bold hover:bg-stone-800 transition-colors">Reintentar</button>
                </div>
            </div>
        );

        // --- PANTALLA DE LOGIN ---
        const LoginScreen = ({ onLogin, credentials }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setIsLoading(true);
                setTimeout(() => {
                    if (username === credentials.user && password === credentials.pass) {
                        onLogin();
                    } else {
                        setError('Usuario o contraseña incorrectos');
                        setIsLoading(false);
                    }
                }, 800);
            };

            return (
                <div className="h-full w-full bg-stone-900 flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-500 relative">
                        <div className="absolute top-0 left-0 w-full h-32 bg-gradient-to-br from-emerald-600 to-teal-700 opacity-10 pointer-events-none"></div>

                        <div className="p-8 pb-6 flex flex-col items-center justify-center relative z-10">
                            <div className="bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-5 rounded-2xl mb-5 shadow-xl shadow-emerald-900/20 transform hover:scale-105 transition-transform duration-300">
                                <MateIcon size={48} strokeWidth={1.5} />
                            </div>
                            <h2 className="font-bold text-2xl text-stone-800 mb-1 tracking-tight text-center">Por Amor Al Mate</h2>
                            <p className="text-stone-500 text-sm font-medium tracking-wide uppercase">Sistema de Gestión</p>
                        </div>

                        <form onSubmit={handleSubmit} className="px-8 pb-8 pt-2 space-y-5">
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-stone-500 uppercase tracking-wider ml-1">Usuario</label>
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 group-focus-within:text-emerald-600 transition-colors"><Info size={18} /></div>
                                    <input 
                                        type="text" 
                                        className="w-full pl-11 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all placeholder:text-stone-300 font-medium text-stone-700"
                                        placeholder="Ingrese usuario" 
                                        value={username} 
                                        onChange={(e) => setUsername(e.target.value)} 
                                        autoFocus 
                                    />
                                </div>
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-stone-500 uppercase tracking-wider ml-1">Contraseña</label>
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 group-focus-within:text-emerald-600 transition-colors"><Lock size={18} /></div>
                                    <input 
                                        type="password" 
                                        className="w-full pl-11 pr-4 py-3.5 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all placeholder:text-stone-300 font-medium text-stone-700"
                                        placeholder="••••••••" 
                                        value={password} 
                                        onChange={(e) => setPassword(e.target.value)} 
                                    />
                                </div>
                            </div>
                            {error && <div className="text-red-500 text-sm font-medium flex items-center gap-2 bg-red-50 p-3.5 rounded-xl animate-in slide-in-from-top-2 border border-red-100"><AlertCircle size={16} /> {error}</div>}
                            
                            <button 
                                type="submit" 
                                disabled={isLoading}
                                className="w-full bg-gradient-to-r from-stone-800 to-stone-900 hover:from-stone-700 hover:to-stone-800 text-white py-4 rounded-xl font-bold shadow-lg shadow-stone-900/20 transition-all active:scale-95 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-4"
                            >
                                {isLoading ? <Loader2 size={20} className="animate-spin text-emerald-400" /> : 'Iniciar Sesión'}
                            </button>
                        </form>
                        
                         <div className="bg-stone-50 p-4 text-center border-t border-stone-100">
                             <p className="text-[10px] text-stone-400 font-medium">© {new Date().getFullYear()} Por Amor Al Mate</p>
                        </div>
                    </div>
                </div>
            );
        };

        // --- UTILS & COMPONENTS ---
        const getHash = (str) => {
            if (!str) return 0;
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return hash;
        };

        const GenerativePattern = ({ hash, color }) => {
            const patternType = Math.abs(hash) % 4; 
            return (
                <svg width="100%" height="100%" className="absolute inset-0 opacity-10 pointer-events-none">
                    <pattern id={`pattern-${hash}`} x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
                        {patternType === 0 && <circle cx="6" cy="6" r="2" fill={color} />}
                        {patternType === 1 && <path d="M0 12L12 0M-2 2L2 -2M10 14L14 10" stroke={color} strokeWidth="1.5" />}
                        {patternType === 2 && <rect x="3" y="3" width="6" height="6" rx="1" stroke={color} strokeWidth="1.5" fill="none" />}
                        {patternType === 3 && <path d="M6 0L6 12M0 6L12 6" stroke={color} strokeWidth="1" />}
                    </pattern>
                    <rect width="100%" height="100%" fill={`url(#pattern-${hash})`} />
                </svg>
            );
        };

        const MateIcon = ({ size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                <path d="M7 10c0 4.5 2.5 8 7 8s7-3.5 7-8" /> <ellipse cx="14" cy="10" rx="7" ry="2.5" /> <path d="M14 10l-3-8" /> <path d="M11 2l-2 2" />
            </svg>
        );

        // Mate gourd realista
        const MateGourIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* cuerpo del mate */}
                <path d="M8 8 C5 9 4 12 4 14 C4 18 7 21 12 21 C17 21 20 18 20 14 C20 12 19 9 16 8 Z"/>
                {/* cuello */}
                <path d="M9 8 C9 6 10 5 12 5 C14 5 15 6 15 8"/>
                {/* boca */}
                <ellipse cx="12" cy="5" rx="3" ry="1.2"/>
                {/* bombilla */}
                <line x1="12" y1="4" x2="17" y2="1"/>
                {/* detalle lateral */}
                <path d="M7 13 C7 11 8.5 10 12 10" strokeWidth="1" opacity="0.5"/>
            </svg>
        );
        // Bombilla detallada
        const BombillaIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* caño */}
                <line x1="7" y1="22" x2="17" y2="4"/>
                {/* filtro abombado en la punta */}
                <ellipse cx="7.5" cy="21" rx="3" ry="1.5" transform="rotate(-25 7.5 21)"/>
                {/* detalle caño */}
                <line x1="9" y1="18" x2="15" y2="8" strokeWidth="2.5" opacity="0.15"/>
                {/* boquilla */}
                <rect x="15.5" y="2" width="2.5" height="4" rx="1.2" transform="rotate(25 16.7 4)"/>
            </svg>
        );
        // Termo con tapa
        const ThermoIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* tapa */}
                <rect x="9" y="1" width="6" height="3" rx="1"/>
                {/* cuello */}
                <path d="M9 4 L8 6 L16 6 L15 4"/>
                {/* cuerpo */}
                <rect x="7" y="6" width="10" height="15" rx="3"/>
                {/* línea reflejo */}
                <line x1="10" y1="9" x2="10" y2="18" strokeWidth="1" opacity="0.35"/>
                {/* base */}
                <path d="M8 21 h8" strokeWidth="2"/>
            </svg>
        );
        // Grabado laser
        const LaserIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* cabezal laser */}
                <rect x="8" y="1" width="8" height="5" rx="1.5"/>
                <line x1="12" y1="6" x2="12" y2="10"/>
                {/* rayo laser */}
                <path d="M12 10 L8 20" strokeWidth="1.5"/>
                <path d="M12 10 L16 20" strokeWidth="1" opacity="0.4"/>
                {/* pieza grabada */}
                <rect x="4" y="18" width="16" height="4" rx="1"/>
                {/* brillos del grabado */}
                <line x1="8" y1="20" x2="16" y2="20" strokeWidth="1" opacity="0.5"/>
            </svg>
        );
        // Morral/bolso cruzado
        const BagIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* cuerpo */}
                <rect x="4" y="8" width="16" height="13" rx="2.5"/>
                {/* asa superior */}
                <path d="M8 8 V5 Q12 2 16 5 V8"/>
                {/* bolsillo frontal */}
                <rect x="7" y="13" width="10" height="5" rx="1.5"/>
                {/* cierre bolsillo */}
                <line x1="12" y1="13" x2="12" y2="18"/>
            </svg>
        );
        // Estuche/caja
        const EstucheIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* tapa */}
                <path d="M3 9 L12 5 L21 9 L12 13 Z"/>
                {/* cuerpo */}
                <path d="M3 9 L3 18 Q3 20 5 20 L19 20 Q21 20 21 18 L21 9"/>
                {/* líneas */}
                <line x1="12" y1="13" x2="12" y2="20"/>
            </svg>
        );
        // Pulsera
        const BraceletIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <circle cx="12" cy="12" r="7"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="12" cy="5" r="1.2" fill="currentColor"/>
                <circle cx="17.95" cy="8.5" r="1.2" fill="currentColor"/>
                <circle cx="17.95" cy="15.5" r="1.2" fill="currentColor"/>
                <circle cx="12" cy="19" r="1.2" fill="currentColor"/>
                <circle cx="6.05" cy="15.5" r="1.2" fill="currentColor"/>
                <circle cx="6.05" cy="8.5" r="1.2" fill="currentColor"/>
            </svg>
        );
        // Canasta/set regalo
        const BasketIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {/* asa */}
                <path d="M7 10 Q7 4 12 4 Q17 4 17 10"/>
                {/* cuerpo */}
                <path d="M3 10 h18 L19 20 Q19 21 18 21 H6 Q5 21 5 20 Z"/>
                {/* líneas tejido */}
                <line x1="3" y1="14" x2="21" y2="14" strokeWidth="1" opacity="0.5"/>
                <line x1="7" y1="10" x2="5" y2="21" strokeWidth="1" opacity="0.5"/>
                <line x1="12" y1="10" x2="12" y2="21" strokeWidth="1" opacity="0.5"/>
                <line x1="17" y1="10" x2="19" y2="21" strokeWidth="1" opacity="0.5"/>
            </svg>
        );
        // Yerba / hoja mate
        const YerbaIcon = ({ size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M12 21 C12 21 4 16 4 9 C4 5 7.5 2 12 2 C16.5 2 20 5 20 9 C20 16 12 21 12 21Z"/>
                <line x1="12" y1="21" x2="12" y2="9"/>
                <path d="M12 13 L8 10" strokeWidth="1.2" opacity="0.7"/>
                <path d="M12 16 L16 13" strokeWidth="1.2" opacity="0.7"/>
                <path d="M12 10 L16 7" strokeWidth="1.2" opacity="0.7"/>
            </svg>
        );

        const PRODUCT_ICON_MAP = [
            { keys: ['bombilla', 'pico de loro', 'pico loro', 'bombill'], icon: BombillaIcon, color: '#b8860b' },
            { keys: ['termo'], icon: ThermoIcon, color: '#2563eb' },
            { keys: ['grabado', 'laser', 'láser', 'grabacion', 'grabación', 'personaliz', 'grabado simple'], icon: LaserIcon, color: '#7c3aed' },
            { keys: ['yerba', 'canarias', 'rosamonte', 'playadito', 'nobleza', 'taragui'], icon: YerbaIcon, color: '#15803d' },
            { keys: ['canasta', 'set ', 'kit ', 'regalo', 'combo'], icon: BasketIcon, color: '#d97706' },
            { keys: ['morral', 'bolso', 'mochila'], icon: BagIcon, color: '#0891b2' },
            { keys: ['estuche', 'porta', 'funda'], icon: EstucheIcon, color: '#64748b' },
            { keys: ['pulsera', 'accesorio', 'collar', 'cierra bolsa', 'cierrabols'], icon: BraceletIcon, color: '#db2777' },
            { keys: ['imperial', 'calabaza', 'torpedo', 'camionero', 'criollo', 'madera', 'cuero', 'palo santo', 'algarrobo', 'baldo', 'mate'], icon: MateGourIcon, color: '#7c5c3b' },
        ];

        const getProductIconData = (text) => {
            if (!text) return { icon: MateGourIcon, color: '#7c5c3b' };
            const t = text.toLowerCase();
            for (const entry of PRODUCT_ICON_MAP) {
                if (entry.keys.some(k => t.includes(k))) return { icon: entry.icon, color: entry.color };
            }
            return { icon: MateGourIcon, color: '#7c5c3b' };
        };

        const SmartIcon = ({ iconName, color, detail, productName }) => {
            // Primero intentamos resolver por nombre de producto real, luego por iconName legacy
            const resolved = getProductIconData(productName || detail || '');
            const IconComponent = resolved.icon;
            const resolvedColor = resolved.color;
            const hash = getHash(detail);
            return (
                <div className="relative w-14 h-14 rounded-2xl flex items-center justify-center overflow-hidden shadow-sm transition-transform hover:scale-105 duration-300 bg-white border border-stone-100">
                    <div className="absolute inset-0 opacity-15" style={{ backgroundColor: resolvedColor }}></div>
                    <GenerativePattern hash={hash} color={resolvedColor} />
                    <div className="relative z-10 drop-shadow-sm" style={{ color: resolvedColor }}>
                        <IconComponent size={26} strokeWidth={2} />
                    </div>
                </div>
            );
        };

        const identifyCategory = (text) => {
            if (!text) return 'Varios';
            const t = text.toLowerCase();
            if (t.includes('imperial')) return 'Imperial';
            if (t.includes('camionero')) return 'Camionero';
            if (t.includes('torpedo')) return 'Torpedo';
            if (t.includes('bombilla')) return 'Accesorios';
            if (t.includes('termo') || t.includes('set') || t.includes('canasta')) return 'Sets';
            if (t.includes('yerba')) return 'Consumibles';
            if (t.includes('grabado') || t.includes('laser')) return 'Grabados';
            if (t.includes('morral') || t.includes('bolso')) return 'Bolsos';
            if (t.includes('pulsera')) return 'Accesorios';
            return 'Varios';
        };

        const getSmartIconName = (description) => {
            // Mantenemos por compatibilidad con pedidos viejos, pero ya no se usa para renderizar
            if (!description) return 'mate';
            const t = description.toLowerCase();
            if (t.includes('bombilla')) return 'pen-tool';
            if (t.includes('yerba')) return 'leaf';
            if (t.includes('termo') || t.includes('set')) return 'flask-conical';
            if (t.includes('imperial') || t.includes('camionero')) return 'crown';
            return 'mate';
        };

        const generateColorFromText = (text) => {
            if (!text) return '#5D8C57';
            let hash = 0;
            for (let i = 0; i < text.length; i++) hash = text.charCodeAt(i) + ((hash << 5) - hash);
            const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();

            let chartData = data;
            if (scope === 'month') {
                const weeks = [];
                for (let w = 0; w < Math.ceil(data.length / 7); w++) {
                    const slice = data.slice(w * 7, w * 7 + 7);
                    const total = slice.reduce((s, d) => s + d.value, 0);
                    const from = slice[0]?.label;
                    const to = slice[slice.length - 1]?.label;
                    weeks.push({ label: `${from}–${to}`, value: total, days: slice });
                }
                chartData = weeks;
            }

            const maxVal = Math.max(...chartData.map(d => d.value), 1);
            const hasAnyValue = chartData.some(d => d.value > 0);

        const currentPaid = o.amountPaid || 0;
        const remaining = o.price - currentPaid;

        setPartialPayment({ amount: '', method: 'cash' }); // Reseteamos el form parcial

            const confirmPayment = async (method) => {
    if (!user || !pendingPaymentId) return;
    const order = orders.find(o => o.id === pendingPaymentId);
    if (!order) return;

    let updateData = {};

    if (method === 'partial') {
        const partialVal = parseFloat(partialPayment.amount);
        if (isNaN(partialVal) || partialVal <= 0) {
            addToast('Ingresa un monto válido', 'error');
            return;
        }
        
        const currentPaid = order.amountPaid || 0;
        const newTotalPaid = currentPaid + partialVal;
        const isFullyPaid = newTotalPaid >= order.price;

        // Guardamos el historial del pago
        const newHistoryItem = { date: new Date().toISOString(), amount: partialVal, method: partialPayment.method };
        const updatedHistory = [...(order.paymentHistory || []), newHistoryItem];

        updateData = {
            amountPaid: newTotalPaid,
            paymentHistory: updatedHistory,
            paymentDate: new Date().toISOString()
        };

        if (isFullyPaid) {
            updateData.paid = true;
            updateData.paymentMethod = 'mixed'; // Al ser en partes, queda como mixto
        } else {
            updateData.paid = false;
        }
    } else {
        // Lógica para Efectivo Total, Transf Total o Mixto
        updateData = { 
            paid: true, 
            paymentMethod: method, 
            paymentDate: new Date().toISOString(),
            amountPaid: order.price 
        };
        
        if (method === 'mixed') {
            const total = order.price;
            const cashVal = mixedAmounts.cash === '' ? 0 : parseFloat(mixedAmounts.cash);
            const transferVal = mixedAmounts.transfer === '' ? 0 : parseFloat(mixedAmounts.transfer);
            if (Math.abs((cashVal + transferVal) - total) > 1) { addToast(`La suma debe dar $${total.toLocaleString()}`, 'error'); return; }
            updateData.paymentDetails = { cash: cashVal, transfer: transferVal };
        } else { 
            updateData.paymentDetails = null; 
        }
    }

    try {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', pendingPaymentId), updateData);
        setIsPaymentModalOpen(false); 
        setPendingPaymentId(null); 
        addToast(updateData.paid ? 'Pago total registrado' : 'Adelanto registrado', 'success');
    } catch (e) {
        addToast('Error al registrar el pago', 'error');
    }
};

            const handleDeliveryConfirm = async () => {

                const finalDate = deliveryDateInput ? new Date(deliveryDateInput).toISOString() : new Date().toISOString();
                try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', pendingDeliveryId), { delivered: true, deliveryDate: finalDate }); addToast('Entrega registrada'); setIsDeliveryModalOpen(false); setPendingDeliveryId(null); } catch(e) { addToast('Error al registrar entrega', 'error'); }

            const toggle = async (id, field) => {
                const order = orders.find(o => o.id === id);
                if (!order) return;
                const updates = {};
                if (field === 'paid') {
                    if (!order.paid) { updates.paid = true; updates.paymentDate = new Date().toISOString(); } 
                    else { updates.paid = false; updates.paymentDate = null; }
                } else if (field === 'delivered') {
                    if (!order.delivered) { setPendingDeliveryId(id); const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); setDeliveryDateInput(now.toISOString().slice(0, 16)); setIsDeliveryModalOpen(true); return; } 
                    else { updates.delivered = false; updates.deliveryDate = null; }
                } else { updates[field] = !order[field]; }
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', id), updates);
            };

                                    <div className="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
                                        <div className="p-4 border-b border-stone-100 bg-stone-50/50"><h3 className="font-bold text-stone-800">Movimientos de {monthLabel}</h3></div>

                                                <tbody>
                                                    {finances.movements.length === 0 ? <tr><td colSpan={5} className="px-4 py-8 text-center text-stone-400">Sin movimientos este mes.</td></tr> : finances.movements.map((mov) => (
                                                        <tr key={mov.id} className="border-b border-stone-100 hover:bg-stone-50/50">
                                                            <td className="px-4 py-3 text-stone-500 w-32">{new Date(mov.date).toLocaleDateString(undefined, {day:'2-digit', month:'2-digit'})}<span className="block text-[10px] text-stone-400">{new Date(mov.date).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'})}</span></td>

                                                                {mov.type === 'expense' && <span className="text-[10px] text-red-600 bg-red-50 px-1.5 py-0.5 rounded ml-1">Gasto</span>}
                                                                {mov.type === 'internal_transfer' && <span className="text-[10px] text-indigo-600 bg-indigo-50 border border-indigo-100 px-1.5 py-0.5 rounded ml-1">Mov. Interno</span>}

                                            </div>

                                            <p className={`text-3xl font-black ${statsAnalytics.netProfit >= 0 ? 'text-emerald-700' : 'text-red-600'}`}>{statsAnalytics.netProfit >= 0 ? '+' : ''}${statsAnalytics.netProfit.toLocaleString()}</p>
                                            <p className="text-xs text-stone-400 mt-2">Ingresos <span className="font-bold text-stone-600">${statsAnalytics.totalRevenue.toLocaleString()}</span> — Gastos <span className="font-bold text-stone-600">${statsAnalytics.periodExpenses.toLocaleString()}</span></p>
                                        </div>

                                        <div className="bg-white border border-stone-200 rounded-2xl p-4 shadow-sm">

                                            </div>
                                        </div>
                                    </div>

                                    {/* ── GRÁFICO del periodo ── */}
                                    <div className="bg-white border border-stone-200 rounded-2xl p-5 shadow-sm">
                                        <p className="text-xs text-stone-400 font-bold uppercase tracking-wider mb-1 flex items-center gap-1.5"><BarChart3 size={12} className="text-emerald-500"/>Ingresos por {statScope === 'month' ? 'día' : 'mes'}</p>

                                            <SimpleChart data={statsAnalytics.chartData} scope={statScope} />
                                        </div>

                                                    <div>
                                                        <p className="font-bold text-amber-800 text-sm">{statsAnalytics.pendingPayOrders.length} pedidos sin cobrar</p>

                                                    <div className="bg-blue-100 text-blue-600 p-2.5 rounded-xl shrink-0"><Truck size={20}/></div>
                                                    <div>
                                                        <p className="font-bold text-blue-800 text-sm">{statsAnalytics.pendingDeliveryOrders.length} pedidos sin entregar</p>
                                                        <p className="text-blue-600 text-xs">Pendientes de despacho</p>
                                                    </div>
                                                </div>

                                                                <div className="opacity-0 group-hover:opacity-100 absolute -top-7 left-1/2 -translate-x-1/2 bg-stone-800 text-white text-[9px] px-1.5 py-0.5 rounded whitespace-nowrap z-10">

                                                            </div>
                                                        );

                                                        const maxRev = list[0]?.revenue || 1;
                                                        return (
                                                            <div key={i}>
                                                                <div className="flex items-center justify-between text-sm mb-1">
                                                                    <div className="flex items-center gap-2">

                                <div className="space-y-1"><label className="text-xs font-bold text-stone-400 uppercase">Cliente</label><input type="text" placeholder="Nombre..." autoFocus className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm font-bold" value={form.client} onChange={e => setForm({...form, client: e.target.value})} /></div>

                                            className={`flex items-center justify-center gap-2 py-2.5 rounded-xl border-2 font-bold text-sm transition-all ${!isCustomItem ? 'bg-stone-800 border-stone-800 text-white' : 'bg-white border-stone-200 text-stone-400 hover:border-stone-300'}`}

                                            <Boxes size={15}/> Producto
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => { setIsCustomItem(true); setSubItem({ productId: '', quantity: 1, unitPrice: 0, detail: 'Grabado láser' }); }}
                                            className={`flex items-center justify-center gap-2 py-2.5 rounded-xl border-2 font-bold text-sm transition-all ${isCustomItem ? 'bg-violet-600 border-violet-600 text-white' : 'bg-white border-stone-200 text-stone-400 hover:border-violet-300'}`}
                                        >
                                            <LaserIcon size={15}/> Servicio
                                        </button>
                                    </div>

                                    {/* Modo Servicio */}
                                    {isCustomItem ? (
                                        <div className="bg-violet-50 border border-violet-100 rounded-2xl p-3 space-y-2">
                                            <div className="flex items-center gap-1.5 mb-1">
                                                <LaserIcon size={13} className="text-violet-500"/>
                                                <p className="text-[11px] font-bold text-violet-600 uppercase tracking-wide">Servicio personalizado</p>
                                            </div>
                                            {/* Sugerencias rápidas */}
                                            <div className="flex flex-wrap gap-1.5">
                                                {['Grabado láser', 'Grabado simple', 'Personalización', 'Servicio a medida'].map(s => (

                                                        type="button"
                                                        onClick={() => setSubItem({...subItem, detail: s})}
                                                        className={`text-[11px] px-2.5 py-1 rounded-full border font-bold transition-all ${subItem.detail === s ? 'bg-violet-600 text-white border-violet-600' : 'bg-white text-violet-600 border-violet-200 hover:bg-violet-50'}`}

                                                    <input
                                                        type="number"
                                                        placeholder="Precio del servicio"
                                                        className="w-full pl-7 pr-3 p-2.5 bg-white border border-violet-200 rounded-xl text-sm font-mono focus:ring-2 focus:ring-violet-500/20 focus:border-violet-400 outline-none"

                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={handleAddItem}
                                                    disabled={!subItem.detail?.trim() || !subItem.unitPrice || parseFloat(subItem.unitPrice) <= 0}

                                                >
                                                    <Plus size={16}/> Agregar
                                                </button>
                                            </div>
                                            {subItem.unitPrice > 0 && (
                                                <p className="text-[10px] text-right text-violet-600 font-bold">Subtotal: ${(parseFloat(subItem.unitPrice) || 0).toLocaleString()}</p>
                                            )}
                                        </div>
                                    ) : (
                                        /* Modo Producto */
                                        <div className="space-y-2">
                                            <div className="flex gap-2 items-center">
                                                <div className="relative flex-1">
                                                    <select
                                                        className="w-full p-2.5 bg-white border border-stone-200 rounded-xl text-sm appearance-none pr-8 focus:ring-2 focus:ring-stone-300 outline-none"
                                                        value={subItem.productId}
                                                        onChange={handleSelectProduct}
                                                    >
                                                        <option value="">Elegir producto del stock...</option>
                                                        {inventory.filter(p => (parseInt(p.stock) || 0) > 0).map(p => (
                                                            <option key={p.id} value={p.id}>
                                                                {p.name} ({p.stock} u.) — ${(p.price || 0).toLocaleString()}
                                                            </option>
                                                        ))}
                                                    </select>
                                                    <div className="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-stone-400"><Boxes size={14}/></div>
                                                </div>
                                                <input
                                                    type="number" min="1"
                                                    className="w-16 p-2.5 bg-white border border-stone-200 rounded-xl text-sm text-center font-mono"
                                                    value={subItem.quantity}
                                                    onChange={e => setSubItem({...subItem, quantity: e.target.value})}
                                                    placeholder="Cant"

                                                <button
                                                    type="button"
                                                    onClick={handleAddItem}
                                                    disabled={!subItem.productId}
                                                    className="bg-emerald-600 hover:bg-emerald-500 text-white p-2.5 rounded-xl transition-colors disabled:opacity-40 disabled:cursor-not-allowed shrink-0"
                                                >
                                                    <Plus size={20}/>
                                                </button>
                                            </div>
                                            {subItem.unitPrice > 0 && subItem.quantity > 0 && (
                                                <p className="text-[10px] text-right text-emerald-600 font-bold">
                                                    Subtotal: ${(subItem.unitPrice * (parseInt(subItem.quantity) || 1)).toLocaleString()}
                                                </p>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="flex items-center gap-2 py-1"><button type="button" onClick={() => setForm({...form, important: !form.important})} className={`flex-1 py-3 px-4 rounded-xl border flex items-center justify-center gap-2 ${form.important ? 'bg-amber-50 border-amber-200 text-amber-600' : 'bg-white text-stone-400'}`}><Star size={18} fill={form.important ? "currentColor" : "none"} /> <span className="text-sm font-bold">Importante</span></button></div>
                            <button type="submit" disabled={isSaving || form.items.length === 0} className={`w-full text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed transition-colors ${form.items.length === 0 ? 'bg-stone-400' : 'bg-stone-900 hover:bg-stone-800'}`}>{isSaving ? <Loader2 size={20} className="animate-spin" /> : (editingId ? 'Guardar Cambios' : 'Confirmar Pedido')}</button>
                        </form>
                    </Modal>

                   <Modal isOpen={isPaymentModalOpen} onClose={() => setIsPaymentModalOpen(false)} title="Registrar Cobro">
    {(() => {
        const pendingOrder = orders.find(o => o.id === pendingPaymentId);
        const totalPrice = pendingOrder?.price || 0;
        const alreadyPaid = pendingOrder?.amountPaid || 0;
        const remaining = totalPrice - alreadyPaid;
        const hasAdvance = alreadyPaid > 0;

        return paymentModalStep === 'select' ? (
            <div className="space-y-4 pt-1">
                {/* Resumen del pedido */}
                <div className="bg-stone-50 border border-stone-100 rounded-2xl p-4">
                    <p className="text-xs text-stone-400 uppercase font-bold mb-2">Pedido: {pendingOrder?.client}</p>
                    <div className="flex items-center justify-between">
                        <div>
                            <p className="text-xs text-stone-400">Total</p>
                            <p className="text-xl font-black text-stone-800">${totalPrice.toLocaleString()}</p>
                        </div>
                        {hasAdvance && (
                            <>
                                <div className="text-stone-200">→</div>
                                <div>
                                    <p className="text-xs text-orange-500">Ya pagó</p>
                                    <p className="text-xl font-black text-orange-500">${alreadyPaid.toLocaleString()}</p>
                                </div>
                                <div className="text-stone-200">→</div>
                                <div>
                                    <p className="text-xs text-red-500 font-bold">Resta</p>
                                    <p className="text-xl font-black text-red-500">${remaining.toLocaleString()}</p>
                                </div>
                            </>
                        )}
                    </div>
                    {hasAdvance && (
                        <div className="mt-2">
                            <div className="h-1.5 w-full bg-red-100 rounded-full overflow-hidden">
                                <div className="h-full bg-orange-400 rounded-full" style={{ width: `${Math.min((alreadyPaid / totalPrice) * 100, 100)}%` }}></div>
                            </div>
                        </div>
                    )}
                </div>

                {/* Pagos completos */}
                <div>
                    <p className="text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-2 ml-1">Pago completo del saldo restante (${remaining.toLocaleString()})</p>
                    <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => confirmPayment('cash')} className="flex flex-col items-center justify-center p-5 bg-green-50 border-2 border-green-200 rounded-2xl hover:bg-green-100 hover:border-green-300 transition-all gap-2 group">
                            <div className="bg-green-100 text-green-700 p-3 rounded-full group-hover:scale-110 transition-transform"><Banknote size={26}/></div>
                            <span className="font-bold text-green-800 text-sm">Efectivo</span>
                            <span className="text-[10px] text-green-600 bg-green-100 px-2 py-0.5 rounded-full">Pago total</span>
                        </button>
                        <button onClick={() => confirmPayment('transfer')} className="flex flex-col items-center justify-center p-5 bg-blue-50 border-2 border-blue-200 rounded-2xl hover:bg-blue-100 hover:border-blue-300 transition-all gap-2 group">
                            <div className="bg-blue-100 text-blue-700 p-3 rounded-full group-hover:scale-110 transition-transform"><CreditCard size={26}/></div>
                            <span className="font-bold text-blue-800 text-sm">Transferencia</span>
                            <span className="text-[10px] text-blue-600 bg-blue-100 px-2 py-0.5 rounded-full">Pago total</span>
                        </button>
                    </div>
                </div>

                {/* Divisor */}
                <div className="flex items-center gap-3">
                    <div className="flex-1 h-px bg-stone-100"></div>
                    <span className="text-[10px] text-stone-400 font-bold uppercase">Otras opciones</span>
                    <div className="flex-1 h-px bg-stone-100"></div>
                </div>

                {/* Mixto y Adelanto */}
                <div className="space-y-2">
                    <button onClick={() => setPaymentModalStep('mixed')} className="w-full flex items-center gap-4 p-4 bg-purple-50 border-2 border-purple-200 rounded-2xl hover:bg-purple-100 hover:border-purple-300 transition-all group">
                        <div className="bg-purple-100 text-purple-700 p-2.5 rounded-xl group-hover:scale-110 transition-transform flex gap-0.5"><Banknote size={18}/><CreditCard size={18}/></div>
                        <div className="text-left">
                            <p className="font-bold text-purple-800 text-sm">Pago Mixto</p>
                            <p className="text-[11px] text-purple-500">Parte en efectivo + parte en transferencia</p>
                        </div>
                    </button>
                    <button onClick={() => setPaymentModalStep('partial')} className="w-full flex items-center gap-4 p-4 bg-orange-50 border-2 border-orange-200 rounded-2xl hover:bg-orange-100 hover:border-orange-300 transition-all group">
